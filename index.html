<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pendaftaran Praktikum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sistem Pendaftaran Praktikum</h1>
    <div class="header-info">
      <span id="jam"></span>
      <span id="browser-info"></span>
    </div>
  </header>
  <main>
    <form id="form-daftar">
      <h2>Formulir Pendaftaran</h2>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
        <span class="error-msg" id="nama-error"></span>
      </div>
      <div class="form-group">
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" placeholder="Masukkan NIM">
        <span class="error-msg" id="nim-error"></span>
      </div>
      <div class="form-group">
        <label for="fakultas">Fakultas</label>
        <select id="fakultas" name="fakultas">
          <option value="">-- Pilih Fakultas --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi" disabled>
          <option value="">-- Pilih Program Studi --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mk">Mata Kuliah Praktikum</label>
        <select id="mk" name="mk">
          <option value="">-- Pilih Mata Kuliah --</option>
        </select>
      </div>
      <button type="submit">Daftar</button>
    </form>
  </main>
  <footer>
    <p>Sistem Pendaftaran Praktikum &copy; 2026</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
